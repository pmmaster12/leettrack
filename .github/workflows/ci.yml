name: Extension CI

on:
  push:
    paths:
      - 'extension/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
